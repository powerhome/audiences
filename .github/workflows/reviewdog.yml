name: Automated Code Reviews
on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  brakeman:
    name: brakeman
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        # Brakeman reads source statically and never runs the app, so it does not
        # need the app's exact interpreter. Without a ruby-version input, setup-ruby
        # reads .ruby-version, and the job then fails for the day or two after any
        # Ruby release before ruby-builder publishes a matching binary, which blocks
        # this required check exactly when a Ruby security patch is being shipped.
        # Pin a stable Ruby that can run Brakeman instead.
        uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: "3.4"
      - name: "brakeman audiences"
        uses: reviewdog/action-brakeman@0fee43fec04facd0f7fb907e2e70ce622a3b7ddb # v2.21.0
        with:
          brakeman_version: gemfile
          tool_name: "audiences"
          workdir: "./audiences"
  bearer:
    name: bearer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: latest
      - name: bearer
        uses: bearer/bearer-action@828eeb928ce2f4a7ca5ed57fb8b59508cb8c79bc # v2
        with:
          diff: true
          format: rdjson
          output: rd.json
          config-file: bearer.yml
      - name: Run reviewdog
        if: always()
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch rd.json && cat rd.json | reviewdog -f=rdjson -reporter=github-pr-check
