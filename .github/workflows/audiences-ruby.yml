name: audiences-ruby

on:
  push:

jobs:
  brakeman:
    name: Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true
          ruby-version: '3.3.13'
          working-directory: audiences
      - name: Brakeman
        uses: reviewdog/action-brakeman@0fee43fec04facd0f7fb907e2e70ce622a3b7ddb # v2.21.0
        with:
          workdir: audiences

  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }} / ${{ matrix.gemfile }}
    env:
      DATABASE_USER: dbuser
      DATABASE_PASS: dbpass
      DATABASE_HOST: 127.0.0.1
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - 3.3
        gemfile:
          - gemfiles/rails_7_1.gemfile
          - gemfiles/rails_7_2.gemfile
          - gemfiles/rails_8_0.gemfile
          - gemfiles/rails_8_1.gemfile
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: ${{ env.DATABASE_USER }}
          POSTGRES_PASSWORD: ${{ env.DATABASE_PASS }}
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      mysql:
        image: mysql:latest
        env:
          MYSQL_USER: ${{ env.DATABASE_USER }}
          MYSQL_PASSWORD: ${{ env.DATABASE_PASS }}
          MYSQL_RANDOM_ROOT_PASSWORD: yes
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install non-ruby dependencies
        run: sudo apt-get install libpq-dev
      - name: 'mysql2 adapter'
        uses: powerhome/github-actions-workflows/build-ruby-gem@6b1da8fa29815465ebc91e95e34b98dd2f730d69 # main
        env:
          DATABASE_ADAPTER: mysql2
          DATABASE_PORT: 3306
        with:
          workdir: audiences
          ruby: ${{ matrix.ruby }}
          gemfile: ${{ matrix.gemfile }}
      - name: 'postgresql adapter'
        uses: powerhome/github-actions-workflows/build-ruby-gem@6b1da8fa29815465ebc91e95e34b98dd2f730d69 # main
        env:
          DATABASE_ADAPTER: postgresql
          DATABASE_PORT: 5432
        with:
          workdir: audiences
          ruby: ${{ matrix.ruby }}
          gemfile: ${{ matrix.gemfile }}

  license-compliance:
    uses: powerhome/github-actions-workflows/.github/workflows/license-compliance.yml@6b1da8fa29815465ebc91e95e34b98dd2f730d69 # main
    with:
      workdir: audiences

  all:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    name: All
    needs: [build, license-compliance]
    steps:
      - run: |
          result="${{ needs.build.result }}"
          if [[ $result == "success" || $result == "skipped" ]]; then
            exit 0
          else
            exit 1
          fi

  release:
    needs: [build, license-compliance]
    runs-on: ubuntu-latest
    if: ${{ contains(github.ref, 'refs/tags/v') && contains(github.ref, 'audiences-ruby') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: "22.23.4"
      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true
          ruby-version: '3.3.13'
          working-directory: audiences
      - name: Setup Gem Credentials
        run: |
          echo "Setting up gem credentials..."
          set +x
          mkdir -p ~/.gem

          truncate -s 0 ~/.gem/credentials
          echo "---" >> ~/.gem/credentials
          echo ":rubygems_api_key: $RUBYGEMS_API_KEY" >> ~/.gem/credentials

          chmod 0600 ~/.gem/credentials

          bundle exec rake build release:guard_clean release:rubygem_push
        working-directory: audiences
        env:
          RUBYGEMS_API_KEY: ${{ secrets.rubygems_api_key }}
